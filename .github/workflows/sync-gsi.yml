name: Sync GSI to Google Drive

on:
  schedule:
    - cron: "17 4 * * *"   # каждый день
  workflow_dispatch:

permissions:
  contents: write

concurrency: sync-gsi

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Install rclone
        run: curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Configure rclone
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONF" | sed 's/[«»“”„]/"/g; s/\xc2\xa0/ /g' > ~/.config/rclone/rclone.conf

      - name: Download & upload
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RCLONE_REMOTE: ${{ vars.RCLONE_REMOTE || 'gdrive:GSI' }}
        run: python3 scripts/sync.py

      - name: Commit README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add README.md state.json
          git diff --cached --quiet || git commit -m "Update GSI links" && git push
