name: Sync GSI to Google Drive

on:
  schedule:
    - cron: "17 4 * * *"   # каждый день
  push:
    branches: [claude/gci-firmware-google-drive-u16ehm]
    paths: [sources.json]  # добавили ссылку — сразу качаем
  workflow_dispatch:
    inputs:
      releases_back:
        description: 'Сколько последних релизов каждой сборки брать'
        default: '2'
      parallel:
        description: 'Сколько файлов качать одновременно'
        default: '20'

permissions:
  contents: write

concurrency:
  group: sync-gsi
  cancel-in-progress: false

env:
  RELEASES_BACK: ${{ inputs.releases_back || '2' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      items: ${{ steps.plan.outputs.items }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TG_PROXY_TOKEN: ${{ secrets.TG_PROXY_TOKEN }}
          TG_DEBUG: '1'
          MAX_JOBS: '200'
        run: python3 scripts/sync.py --plan
      - name: Publish queue (status branch)
        env:
          ITEMS: ${{ steps.plan.outputs.items }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          python3 scripts/queue_status.py init

  download:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.parallel || '20') }}
      matrix:
        item: ${{ fromJSON(needs.plan.outputs.items) }}
    name: ${{ matrix.item.file }}
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          sudo apt-get install -y p7zip-full xz-utils pigz
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc  # больше места на диске

      - name: Configure rclone
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONF" | sed 's/[«»“”„]/"/g; s/\xc2\xa0/ /g' > ~/.config/rclone/rclone.conf
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          python3 scripts/queue_status.py set "${{ matrix.item.file }}" in_progress

      - name: Download & upload
        env:
          ITEM: ${{ toJSON(matrix.item) }}
          RCLONE_REMOTE: ${{ vars.RCLONE_REMOTE || 'gdrive:GSI' }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          TG_PROXY_TOKEN: ${{ secrets.TG_PROXY_TOKEN }}
        run: |
          [ -n "$TG_SESSION" ] && pip install --quiet telethon cryptg || true
          python3 scripts/sync.py --item

      - name: Update queue status
        if: always()
        run: python3 scripts/queue_status.py set "${{ matrix.item.file }}" "${{ job.status == 'success' && 'success' || 'failure' }}"
