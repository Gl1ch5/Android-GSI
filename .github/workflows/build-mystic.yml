name: Build GSI (MysticGSI)

# Собирает GSI из стоковой прошивки с помощью https://github.com/MysticGSI/mysticgsi
# и кладёт .img на Google Drive, ссылка добавляется в README.
on:
  workflow_dispatch:
    inputs:
      firmware_url:
        description: 'Прямая ссылка на прошивку (OTA zip / factory image / tar …)'
        required: true
      rom_type:
        description: 'Тип прошивки'
        type: choice
        default: auto
        options: [auto, pixel, alos, hyperos, oneui, magicos, coloros, oxygenos, realmeui, nothing, flyme, custom]
      name:
        description: 'Короткое имя сборки (латиница, без пробелов)'
        required: true
        default: pixel16
      android:
        description: 'Версия Android (для таблицы)'
        default: '16'

permissions:
  contents: write

concurrency: build-mystic

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          df -h /

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv curl aria2 openssl patch ca-certificates \
            libarchive-tools default-jre-headless p7zip-full
          curl -fsSL https://rclone.org/install.sh | sudo bash
          git clone --depth 1 https://github.com/MysticGSI/mysticgsi.git "$HOME/mysticgsi"
          cd "$HOME/mysticgsi" && python3 -m venv .venv && .venv/bin/pip install -q -r requirements.txt

      - name: Configure rclone
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONF" | sed 's/[«»“”„]/"/g; s/\xc2\xa0/ /g' > ~/.config/rclone/rclone.conf

      - name: Build GSI
        working-directory: /home/runner/mysticgsi
        env:
          URL: ${{ inputs.firmware_url }}
          TYPE: ${{ inputs.rom_type }}
          NAME: ${{ inputs.name }}
        run: |
          touch /tmp/start
          set -o pipefail
          .venv/bin/python cli.py build "$NAME" "$URL" --type "$TYPE" | tee /tmp/build.log

      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"

      - name: Upload to Google Drive & update README
        env:
          NAME: ${{ inputs.name }}
          TYPE: ${{ inputs.rom_type }}
          ANDROID: ${{ inputs.android }}
          REMOTE: ${{ vars.RCLONE_REMOTE || 'gdrive:GSI' }}
        run: |
          set -e
          TAG="$NAME-$(date +%Y%m%d-%H%M)"
          found=0
          while IFS= read -r img; do
            found=1
            f=$(basename "$img")
            dest="$REMOTE/MysticGSI/$TAG"
            rclone copy "$img" "$dest"
            link=$(rclone link "$dest/$f")
            python3 scripts/add_build.py "$TYPE (MysticGSI)" "$TAG" "$f" "$(stat -c %s "$img")" "$link" "$ANDROID"
          done < <(find /home/runner/mysticgsi/out -newer /tmp/start -type f -name '*.img' -size +200M)
          [ "$found" = 1 ] || { echo "Не найден .img"; exit 1; }
